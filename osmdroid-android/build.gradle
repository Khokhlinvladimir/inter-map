description = 'An Android library to display OpenStreetMap views.'
apply plugin: 'com.android.library'
apply plugin: "maven-publish"

group = project.property("pom.groupId")
version =  project.property("pom.version")

android {
    namespace 'org.osmdroid.library'
    compileSdk 37

    defaultConfig{
        minSdkVersion 24
        targetSdkVersion 36
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    testImplementation "org.junit.vintage:junit-vintage-engine:${project.property('junit.version')}"
    testImplementation "org.robolectric:robolectric:${project.property('robolectric.version')}"

}

import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

abstract class GenerateOsmdroidBuildInfo extends DefaultTask {
    @Input
    abstract Property<String> getVersionName()

    @Input
    abstract Property<String> getBuildDate()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def source = project.file('src/main/filtered/org/osmdroid/OsmdroidBuildInfo.kt')
        def output = outputDirectory.file('org/osmdroid/OsmdroidBuildInfo.kt').get().asFile
        output.parentFile.mkdirs()
        output.setText(source.getText('UTF-8')
                .replace('@pom.version@', versionName.get())
                .replace('@date@', buildDate.get()), 'UTF-8')
    }
}

def copyFiles = tasks.register('copyFiles', GenerateOsmdroidBuildInfo) {
    versionName.set(project.property('pom.version').toString())
    buildDate.set(new Date().toString())
    outputDirectory.set(layout.buildDirectory.dir('generated/sources/osmdroidBuildInfo/kotlin'))
}

afterEvaluate {
    publishing {

        publications {
            release(MavenPublication) {
                from components.named("release").get()
                groupId project.property("pom.groupId")
                artifactId project.name
                version = project.property("pom.version")
                pom {
                    description = project.description
                    url = project.property("pom.url")

                    // SCM, organization, and developers are injected via other mechanisms

                    licenses {
                        license {
                            name = project.property("pom.licenses.license.0.name")
                            url = project.property("pom.licenses.license.0.url")
                            distribution = project.property("pom.licenses.license.0.distribution")
                        }
                    }
                }
            }
        }
    }
}

task androidSourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    from copyFiles
}

artifacts {
    archives androidSourcesJar
}
build.dependsOn(copyFiles)

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.kotlin.addGeneratedSourceDirectory(copyFiles) {
            it.outputDirectory
        }
    }
}
